contract: v2
name: applyzer
version: 0.7.0
description: "Finds live jobs that fit your resume, or takes the ones you paste. Tailors your resume and cover letter to each job from your own facts only and sends the application when you approve it, to a recruiter it finds on the company's own pages. Tracks replies in your inbox: drafts your answers, follows up when nobody writes back, and reports each week which emails get answered."

kind: interactive

runtime:
  framework: langgraph
  python: "3.12"
  entrypoint: src/agent.py:graph
  timeout_seconds: 1500

dependencies:
  lockfile: requirements.lock

inputs:
  - name: jobs
    type: textarea
    label: "Jobs you already chose, one per line: a link, or Company | Role | link | hr@company.com (empty: I find jobs for you)"
  - name: resume_file
    type: file
    label: "Your resume (PDF, Word or text)"
    accept: [pdf, docx, txt]
  - name: resume_text
    type: textarea
    label: "Or paste your resume"
  - name: github_username
    type: text
    label: "GitHub username, to match your projects to each job (optional)"
  - name: looking_for
    type: static-dropdown
    label: "Jobs or internships?"
    options: [jobs, internships]
    default: jobs
  - name: role
    type: text
    label: "Role to search for (blank: the one your resume shows)"
  - name: country
    type: text
    label: "Country"
    default: "India"
  - name: city
    type: text
    label: "Cities, most preferred first (optional)"
  - name: remote
    type: static-dropdown
    label: "Remote, on-site or either?"
    options: [either, prefer remote, remote, on-site or hybrid]
    default: either
  - name: experience_years
    type: text
    label: "Years of experience (blank: from your resume)"
  - name: employment_type
    type: static-dropdown
    label: "Employment type"
    options: [any, full-time, part-time, contract]
    default: any
  - name: count
    type: text
    label: "How many jobs to find (1 to 25)"
    default: "10"
  - name: min_salary
    type: text
    label: "Minimum yearly salary (optional; checked when a posting states pay)"
  - name: notice_days
    type: number
    label: "Notice period, in days"
  - name: current_ctc
    type: text
    label: "Current pay (optional; shared only when a recruiter asks)"
  - name: expected_ctc
    type: text
    label: "Expected pay (optional; shared only when a recruiter asks)"
  - name: work_auth
    type: static-dropdown
    label: "Can you work where these jobs are?"
    options: ["can work there", "needs sponsorship", "not sure"]
    default: "can work there"
  - name: relocate
    type: static-dropdown
    label: "Would you relocate?"
    options: ["yes", "no", "remote only"]
  - name: links
    type: text
    label: "Links to share: LinkedIn, portfolio (optional)"

choose_one:
  - label: "Your resume"
    inputs: [resume_file, resume_text]

models:
  tier: standard

# Gravity's own lookups (no app of the person's): a found person's work address, checked before it is used
built_ins: [hunter.find_email, hunter.verify_email]

sources:
  mail:
    capability: message.list
    label: "Your email, where companies answer your applications"
    same_as: send
    window: 30d      # the farthest back any run looks (an application closes at 21 days); the mailbox (inbox, sent) is named per read
  page:
    capability: web_page.get
    default_app: composio_search
    label: "What reads job postings and company pages"
  search:
    capability: web_result.search
    default_app: composio_search
    label: "Which web search to find job postings with"
  search_more:
    capability: web_result.search
    default_app: exa
    label: "A second web search for more postings (optional)"
    required: false
  answers:
    capability: web_answer.get
    default_app: composio_search
    label: "An AI web search that cites job pages (optional)"
    required: false
  similar:
    capability: web_result.find_similar
    default_app: composio_search
    label: "Finding postings similar to your best matches (optional)"
    required: false

writes:
  send:
    capability: message.send
    default_app: gmail
    label: "The email account your applications go from"
  draft:
    capability: message.create
    label: "Drafts, in the same account"
    same_as: send
  send_draft:
    capability: message.send_draft
    label: "Sends a draft it kept for you (a reply, a follow-up, the application), when you approve it"
    same_as: send
  tracker:
    capability: row.upsert
    default_app: googlesheets   # dev runs gravity-schema 0.13.10+: an optional default that needs a place is not filled in uninvited
    label: "A Google Sheet to keep every application in, one row each (optional)"
    required: false

approvals:
  required_for: [message.send, message.send_draft]

triggers:
  manual: true
  email: { query: "in:inbox is:unread -category:promotions", consumer_can_change: true }

actions:
  - name: prepare
    label: "Prepare applications"
    default: true
  - name: discover
    label: "Find jobs for me"
  - name: pick
    label: "Prepare this one"
    per_row: true
  - name: paste_posting
    label: "Paste the posting"
    per_row: true
    inputs:
      - name: text
        type: textarea
        label: "The posting's text"
  - name: send_email
    label: "Send"
    per_row: true
  - name: send_draft
    label: "Send the draft"
    per_row: true
  - name: mark_applied
    label: "I applied"
    per_row: true
    inputs:
      - name: applied_on
        type: date
        label: "When did you apply? (blank: today)"
  - name: not_applying
    label: "Not applying"
    per_row: true
  - name: check_replies
    label: "Check replies"
  - name: follow_ups
    label: "Follow-ups"
    schedule: { cron: "0 9 * * *", consumer_can_change: true }
  - name: report
    label: "Weekly report"
    schedule: { cron: "0 9 * * 1", consumer_can_change: true }

offer_as: buttons

memory:
  notebook_kb: 256
  notebook_per: user
  collections:
    jobs: { per: user, keep_days: 365, max_items: 5000, max_item_kb: 32 }
    projects: { per: user, keep_days: 365, max_items: 200, max_item_kb: 8 }
    applications: { per: user, keep_days: 365, max_items: 5000, max_item_kb: 64 }
    declined: { per: user, keep_days: 365, max_items: 5000, max_item_kb: 1 }
    suppressed: { per: user, keep_days: 730, max_items: 5000, max_item_kb: 1 }

resources:
  memory_mb: 1024
